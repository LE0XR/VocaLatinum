name: VocaLatinum Supabase Database Tests

on:
  push:
    branches:
      - test
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocalatinum-supabase-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Supabase CLI installieren
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lokale Supabase-Dienste starten
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      - name: Datenbank frisch aufbauen und Migrationen anwenden
        run: supabase db reset

      - name: pgTAP-Datenbanktests ausführen
        run: supabase test db

      - name: Supabase-Dienste beenden
        if: always()
        run: supabase stop --no-backup
